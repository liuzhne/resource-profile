# ==============================================================================
# Render Blueprint Specification - 免费预览部署
# Docs: https://render.com/docs/free
# ==============================================================================

# ------------------------------------------------------------------------------
# 发布流程（RENDER-CD-20260915）：合入 main 即部署生产
# ------------------------------------------------------------------------------
# PR 合入 main → GitHub Actions 在该 main 提交上跑 CI → 全部通过后 Render 才部署
# （每个服务 branch: main + autoDeployTrigger: checksPass）。main 的 ruleset 不要求 PR 检查通过，
# 这是拦住 CI 红的代码上线的唯一关口。
# 每个 Docker 服务的 buildFilter 按 Maven 反应堆依赖划定（自身模块 + common + 父 POM + Dockerfile），
# 只重建真正变化的服务：Hobby 工作区每月仅 500 分钟构建额度，耗尽后 Render 停止构建直至下月。
# 约束：提交上检测不到任何 CI check 时 Render 不部署。新增服务、调整 buildFilter 或新增模块依赖时，
# 必须同步 .github/workflows/{backend,frontend}-ci.yml 的 push 路径。

version: "1"

# ------------------------------------------------------------------------------
# 共享环境变量组（Aiven MySQL 凭据由 Render Dashboard 手工维护，不写入仓库）
# ------------------------------------------------------------------------------
envVarGroups:
  - name: edu-portrait-common-env
    envVars:
      - key: EDUCARE_PERFORMANCE_DATABASE_WARMUP
        value: "true"
      - key: SPRING_MVC_SERVLET_LOAD_ON_STARTUP
        value: "1"
      - key: MYBATIS_PLUS_CONFIGURATION_LOG_IMPL
        value: org.apache.ibatis.logging.nologging.NoLoggingImpl
      - key: SERVER_COMPRESSION_ENABLED
        value: "true"
      - key: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
        value: "true"
      - key: MANAGEMENT_HEALTH_REDIS_ENABLED
        value: "false"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # 禁用 Nacos 注册与配置拉取（Render 独立容器运行）
      - key: SPRING_CLOUD_NACOS_DISCOVERY_ENABLED
        value: "false"
      - key: SPRING_CLOUD_NACOS_CONFIG_ENABLED
        value: "false"
      - key: SPRING_CLOUD_NACOS_CONFIG_IMPORT_CHECK_ENABLED
        value: "false"
      - key: SPRING_CONFIG_IMPORT
        value: "optional:classpath:application.yml"
      # JWT 认证密钥：Render 自动生成强随机 256 位安全密钥
      - key: JWT_SECRET
        generateValue: true
      # MCP 内部通信安全 Token（纵深防御）
      - key: EDUCARE_MCP_TOKEN
        generateValue: true
      # Aiven Free MySQL 强制 TLS。
      # 连接配额实测（2026-09-12）：max_connections=76，历史峰值 Max_used_connections=4，
      # Connection_errors_max_connections=0（从未触顶）。实际连库的仅 7 个服务
      # （gateway 与 mcp-student-data 不连库），故 7 × 3 = 21 条峰值占用仅为配额的 28%。
      - key: MYSQL_SSL_MODE
        value: REQUIRED
      - key: DB_MAXIMUM_POOL_SIZE
        value: "3"
      # 原为 0：连接池不保留空闲连接，每个冷请求都要重建 TCP + TLS + MySQL 认证，
      # 跨区域（服务在 oregon）叠加强制 TLS 约多花 200~500ms。
      # 改为 2 后常驻 7 × 2 = 14 条，占配额 18%，余量充足。
      - key: DB_MINIMUM_IDLE
        value: "2"
      - key: DB_MAX_LIFETIME_MS
        value: "600000"

services:
  # ============================================================================
  # 1. 前端 Vue 3 单页应用 (Render Static Site - 100% 免费全球 CDN)
  # ============================================================================
  - type: web
    name: edu-portrait-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    branch: main
    autoDeployTrigger: checksPass
    envVars:
      # 未配置 LLM 供应商前隐藏 AI 预警与 LLM 追踪入口。
      - key: VITE_AI_ENABLED
        value: "true"
      # Long-lived SSE must bypass the static site's buffering external rewrite.
      - key: VITE_SSE_BASE_URL
        value: "https://edu-portrait-gateway.onrender.com"
      # 打开网站即并行唤醒的后端服务（逗号分隔的公网健康检查地址；网关已内置，经 /api 同源唤醒）。
      # 免费层各服务独立休眠，逐个撞上冷启动是串行叠加；并行唤醒把等待压成一段（见 src/utils/prewarm.js）。
      # 只列前端实际调用的服务：user-service 前端未使用；agent 链路（agent / MCP / ai-inference）
      # 待 agent-service 不响应问题修复后再纳入。每次唤醒会让所列服务至少运行 15 分钟，计入免费实例时长。
      # auth 的 /actuator/health 受其 Spring Security 保护会返回 403，但请求本身已足以唤醒实例。
      - key: VITE_PREWARM_URLS
        value: "https://edu-portrait-auth.onrender.com/actuator/health,https://edu-portrait-teacher.onrender.com/actuator/health,https://edu-portrait-student.onrender.com/actuator/health,https://edu-portrait-mental.onrender.com/actuator/health,https://edu-portrait-data.onrender.com/actuator/health"
    buildFilter:
      paths:
        - frontend/**
    routes:
      # ① 登录链路绕过网关，直连 auth-service。
      # 网关的 JwtAuthGlobalFilter 本就把 /auth/ 整个前缀列为 PUBLIC_PREFIXES（不校验 token，
      # 校验由 auth-service 自身的 Spring Security 完成），故绕过不损失任何鉴权。
      # 收益：登录只需唤醒 1 个服务而非串行唤醒 网关 + auth 两个，砍掉一次冷启动。
      # 注意：更具体的规则必须排在 /api/* 之前，Render 按顺序匹配。
      - type: rewrite
        source: /api/auth/*
        destination: https://edu-portrait-auth.onrender.com/auth/*
      - type: rewrite
        source: /api/*
        destination: https://edu-portrait-gateway.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"

  # ============================================================================
  # 2. 网关服务 (Web Service - 100% 免费层)
  # ============================================================================
  - type: web
    name: edu-portrait-gateway
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./docker/Dockerfile.gateway
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/gateway/**
        - backend/common/**
        - backend/pom.xml
        - docker/Dockerfile.gateway
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: edu-portrait-common-env
      - key: PORT
        value: "8080"
      - key: SERVER_PORT
        value: "8080"
      # 冷启动优化（2026-09-13）：免费实例 0.1 CPU 下 Spring Boot 启动实测 107s，
      # 而 Render 边缘层挂住请求约 114s 就返回 429 —— 唤醒比等待上限还慢，是登录报 429 的根因。
      #   TieredStopAtLevel=1  只用 C1 编译器，省掉 C2 编译开销（代价：稳态吞吐下降，
      #                        本服务以 I/O 为主且长期空闲，可接受）
      #   UseSerialGC          小堆低流量下启动比 G1 更快、CPU 开销更低
      #   egd=urandom          避免低熵容器中 SecureRandom 播种阻塞
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0 -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Djava.security.egd=file:/dev/./urandom"
      # PERF-500MS-20260916：初始化前移，健康检查通过后首个业务请求不再初始化 Bean。
      - key: SPRING_MAIN_LAZY_INITIALIZATION
        value: "false"
      - key: AUTH_SERVICE_URL
        value: https://edu-portrait-auth.onrender.com
      - key: USER_SERVICE_URL
        value: https://edu-portrait-user.onrender.com
      - key: TEACHER_SERVICE_URL
        value: https://edu-portrait-teacher.onrender.com
      - key: STUDENT_SERVICE_URL
        value: https://edu-portrait-student.onrender.com
      - key: MENTAL_SERVICE_URL
        value: https://edu-portrait-mental.onrender.com
      - key: DATA_SERVICE_URL
        value: https://edu-portrait-data.onrender.com
      - key: AGENT_SERVICE_URL
        value: https://edu-portrait-agent.onrender.com
      - key: SPRING_DATA_REDIS_URL
        fromService:
          type: keyvalue
          name: edu-portrait-kv
          property: connectionString

  # ============================================================================
  # 3. 核心业务微服务群 (Web Services - 100% 免费层)
  # ============================================================================
  - type: web
    name: edu-portrait-auth
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./docker/Dockerfile.auth
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/auth-service/**
        - backend/common/**
        - backend/pom.xml
        - docker/Dockerfile.auth
    plan: free
    healthCheckPath: /actuator/health/readiness
    envVars:
      - fromGroup: edu-portrait-common-env
      - key: PORT
        value: "8081"
      - key: SERVER_PORT
        value: "8081"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0 -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Djava.security.egd=file:/dev/./urandom"
      - key: SPRING_MAIN_LAZY_INITIALIZATION
        value: "false"
      - key: SPRING_DATA_REDIS_URL
        fromService:
          type: keyvalue
          name: edu-portrait-kv
          property: connectionString

  - type: web
    name: edu-portrait-user
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./docker/Dockerfile.user
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/user-service/**
        - backend/common/**
        - backend/pom.xml
        - docker/Dockerfile.user
    plan: free
    healthCheckPath: /actuator/health/readiness
    envVars:
      - fromGroup: edu-portrait-common-env
      - key: PORT
        value: "8082"
      - key: SERVER_PORT
        value: "8082"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0 -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Djava.security.egd=file:/dev/./urandom"
      - key: SPRING_MAIN_LAZY_INITIALIZATION
        value: "false"

  - type: web
    name: edu-portrait-teacher
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./docker/Dockerfile.teacher
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/teacher-service/**
        - backend/common/**
        - backend/pom.xml
        - docker/Dockerfile.teacher
    plan: free
    healthCheckPath: /actuator/health/readiness
    envVars:
      - fromGroup: edu-portrait-common-env
      - key: PORT
        value: "8083"
      - key: SERVER_PORT
        value: "8083"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0 -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Djava.security.egd=file:/dev/./urandom"
      - key: SPRING_MAIN_LAZY_INITIALIZATION
        value: "false"

  - type: web
    name: edu-portrait-student
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./docker/Dockerfile.student
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/student-service/**
        - backend/common/**
        - backend/pom.xml
        - docker/Dockerfile.student
    plan: free
    healthCheckPath: /actuator/health/readiness
    envVars:
      - fromGroup: edu-portrait-common-env
      - key: PORT
        value: "8084"
      - key: SERVER_PORT
        value: "8084"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0 -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Djava.security.egd=file:/dev/./urandom"
      - key: SPRING_MAIN_LAZY_INITIALIZATION
        value: "false"

  - type: web
    name: edu-portrait-mental
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./docker/Dockerfile.mental
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/mental-service/**
        - backend/common/**
        - backend/pom.xml
        - docker/Dockerfile.mental
    plan: free
    healthCheckPath: /actuator/health/readiness
    envVars:
      - fromGroup: edu-portrait-common-env
      - key: PORT
        value: "8085"
      - key: SERVER_PORT
        value: "8085"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0 -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Djava.security.egd=file:/dev/./urandom"
      - key: SPRING_MAIN_LAZY_INITIALIZATION
        value: "false"

  - type: web
    name: edu-portrait-data
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./docker/Dockerfile.data
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/data-service/**
        - backend/common/**
        - backend/pom.xml
        - docker/Dockerfile.data
    plan: free
    healthCheckPath: /actuator/health/readiness
    envVars:
      - fromGroup: edu-portrait-common-env
      - key: PORT
        value: "8086"
      - key: SERVER_PORT
        value: "8086"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0 -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Djava.security.egd=file:/dev/./urandom"
      - key: SPRING_MAIN_LAZY_INITIALIZATION
        value: "false"

  # ============================================================================
  # 4. EduCare Agent 智能编排与 MCP 节点 (100% 免费层)
  # ============================================================================
  - type: web
    name: edu-portrait-agent
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./docker/Dockerfile.agent
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/agent-service/**
        - backend/common/**
        - backend/pom.xml
        - docker/Dockerfile.agent
    plan: free
    healthCheckPath: /actuator/health/readiness
    envVars:
      - fromGroup: edu-portrait-common-env
      - key: PORT
        value: "8087"
      - key: SERVER_PORT
        value: "8087"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0 -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Djava.security.egd=file:/dev/./urandom"
      - key: MCP_STUDENT_DATA_URL
        value: https://edu-portrait-mcp-student.onrender.com
      - key: MCP_KNOWLEDGE_RAG_URL
        value: https://edu-portrait-ai-inference.onrender.com
      - key: MCP_KNOWLEDGE_RAG_ENDPOINT
        value: /mcp/
      - key: STUDENT_SERVICE_URL
        value: https://edu-portrait-student.onrender.com
      - key: MENTAL_SERVICE_URL
        value: https://edu-portrait-mental.onrender.com
      - key: DATA_SERVICE_URL
        value: https://edu-portrait-data.onrender.com
      - key: AI_INFERENCE_URL
        value: https://edu-portrait-ai-inference.onrender.com
      - key: MCP_CLIENT_REQUEST_TIMEOUT
        value: 120s
      - key: EDUCARE_AGENT_LOOP_ENABLED
        value: "true"
      - key: SPRING_AI_MCP_CLIENT_ENABLED
        value: "false"
      - key: EDUCARE_MCP_DEFERRED_ENABLED
        value: "true"
      - key: SPRING_AI_OPENAI_BASE_URL
        value: https://api.groq.com/openai
      - key: SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL
        value: openai/gpt-oss-120b
      - key: SPRING_AI_OPENAI_CHAT_OPTIONS_RESPONSE_FORMAT_TYPE
        value: JSON_OBJECT
      - key: SPRING_AI_OPENAI_CHAT_OPTIONS_REASONING_EFFORT
        value: low
      - key: LLM_MAX_TOKENS
        value: "1200"
      - key: LLM_CACHE_PROMPT_ENABLED
        value: "false"
      - key: SPRING_DATA_REDIS_URL
        fromService:
          type: keyvalue
          name: edu-portrait-kv
          property: connectionString

  - type: web
    name: edu-portrait-mcp-student
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./docker/Dockerfile.mcp-student-data
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/mcp-student-data/**
        - backend/common/**
        - backend/pom.xml
        - docker/Dockerfile.mcp-student-data
