# ============================================================
# EduCare 生产站点配置：nginx 作唯一公网入口
#   80  → 跳 443（含 Let's Encrypt ACME 挑战放行）
#   443 → TLS 终止 + 前端 SPA 静态 + /api 反代网关 + Agent SSE
# 证书挂载在 /etc/nginx/certs（见 docker-compose.prod.yml volumes）。
# 本文件挂载进容器，改完 `docker compose ... restart frontend` 即生效，无需重建镜像。
# ============================================================

server {
    listen 80;
    server_name _;

    # Let's Encrypt http-01 挑战（如用 certbot 签发/续期）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # 问卷批量导入等上传留余量
    client_max_body_size 20m;

    # 前端 SPA（Vue Router history 模式：未命中静态资源回退 index.html）
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → 网关：剥离 /api 前缀（与 vite dev 代理 path-rewrite 一致）
    # 例：/api/auth/login → 网关 /auth/login
    location /api/ {
        proxy_pass http://gateway:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Agent 流式（SSE）：关缓冲 + 长读超时 + 清空 Connection，避免 token 流被缓冲卡住
        proxy_set_header Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }
}
