server:
  port: ${PORT:8087}

spring:
  application:
    name: agent-service
  cloud:
    openfeign:
      okhttp:
        enabled: true
      # F-3：开启 CircuitBreaker SPI 桥接，让 @FeignClient(fallbackFactory=) 通过 Sentinel 触发
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 90000   # plan/audit 经过 LLM 可能 60s+，留余量
          ai-inference-service:
            connectTimeout: 5000
            readTimeout: 120000  # AI 链路允许更长

    # Sentinel 流控（D 阶段）：dashboard 留空则只启用本地编码规则，不上报
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:}
    nacos:
      # 注册中心
      discovery:
        enabled: ${SPRING_CLOUD_NACOS_DISCOVERY_ENABLED:true}
        register-enabled: ${SPRING_CLOUD_NACOS_DISCOVERY_REGISTER_ENABLED:true}
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        identity-key: ${NACOS_AUTH_IDENTITY_KEY:serverIdentity}
        identity-value: ${NACOS_AUTH_IDENTITY_VALUE:security}
        service: ${spring.application.name}

      # 配置中心
      config:
        enabled: ${SPRING_CLOUD_NACOS_CONFIG_ENABLED:true}
        import-check:
          enabled: false
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        identity-key: ${NACOS_AUTH_IDENTITY_KEY:serverIdentity}
        identity-value: ${NACOS_AUTH_IDENTITY_VALUE:security}
        file-extension: yml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:edu_portrait}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&sslMode=${MYSQL_SSL_MODE:PREFERRED}
    username: ${MYSQL_USER:edu}
    password: ${MYSQL_PASSWORD:edu123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_MAXIMUM_POOL_SIZE:3}
      minimum-idle: ${DB_MINIMUM_IDLE:0}
      max-lifetime: ${DB_MAX_LIFETIME_MS:600000}

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0

  ai:
    # Groq 免费层按 TPM 限流时会返回 429 和建议等待时间。只把 429 视为可恢复错误；
    # 401/403 等配置或权限错误继续 fail-fast，避免无意义重试。
    retry:
      max-attempts: 3
      on-http-codes:
        - 429
      backoff:
        initial-interval: 15s
        max-interval: 30s
        multiplier: 2
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:${LLM_API_KEY:dummy}}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:${LLM_BASE_URL:http://localhost:8091}}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:${LLM_MODEL:qwen2.5-32b-instruct-q4_k_m}}
          temperature: ${LLM_TEMPERATURE:0.3}
          max-tokens: ${LLM_MAX_TOKENS:2048}
    # H-2.2：MCP client 接两个 Streamable HTTP server。enabled=false 时不初始化任何 MCP 组件，
    # 供 Render 的“暂未配置 LLM/RAG”模式安全启动；默认 true 仍保持 initialize/tools-list fail-fast。
    mcp:
      client:
        enabled: ${SPRING_AI_MCP_CLIENT_ENABLED:true}
        # Render free web services can take 50s+ to wake. Keep fail-fast semantics, but allow
        # enough time for both public MCP dependencies to complete a cold start.
        request-timeout: ${MCP_CLIENT_REQUEST_TIMEOUT:120s}
        streamable-http:
          connections:
            student-data:
              url: ${MCP_STUDENT_DATA_URL:http://localhost:8094}
              endpoint: /mcp
            knowledge-rag:
              url: ${MCP_KNOWLEDGE_RAG_URL:http://localhost:8095}
              # FastAPI/Starlette mounts the Streamable HTTP app at the canonical
              # slash-terminated path. Keep this overridable because the standalone
              # local MCP server may still expose the historical /mcp endpoint.
              endpoint: ${MCP_KNOWLEDGE_RAG_ENDPOINT:/mcp}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# G-3.1：Actuator + Prometheus 暴露策略
# 只放出 health / info / prometheus 三端点，其余默认不可达；
# 路径 /actuator/prometheus 由 ops 抓取。
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

# 日志
logging:
  level:
    com.edu.agent.mapper: debug

educare:
  # MCP 内部预共享 token（纵深防御，A3）。空=仅靠 127.0.0.1 网络隔离（默认）；
  # 与两个 MCP server 配同一值即开启 X-MCP-Token 互验（McpClientConfig 给出站请求附头）。
  mcp:
    token: ${EDUCARE_MCP_TOKEN:}
  export:
    # F-1：PDF 导出落盘目录。需可写；启动时若不存在自动创建。
    storage-path: ${EDUCARE_EXPORT_PATH:/tmp/edu-exports}
    # 中文字体路径（classpath: 或 file:）。缺失时 PDF 中文将渲染为方块。详见 docs/educare/deploy.md。
    font-path: ${EDUCARE_FONT_PATH:classpath:/fonts/NotoSansSC-Regular.ttf}
  sse:
    # F-2：SSE 单连接最大存活时长（毫秒）。1800000 = 30 分钟，超时后前端会自动重连。
    timeout-millis: ${EDUCARE_SSE_TIMEOUT_MS:1800000}
    # F-2：心跳间隔（毫秒）。低于 Nginx/Gateway 的 idle timeout 即可，30s 通用安全值。
    heartbeat-millis: ${EDUCARE_SSE_HEARTBEAT_MS:30000}
  rate-limit:
    # /trigger 端点全局 QPS 阈值（D 阶段：保护本地 GPU 推理）
    trigger-qps: ${EDUCARE_TRIGGER_QPS:2}
  idempotency:
    # 同一 studentId 在该窗口内不重复触发；命中则返回已有任务 id
    trigger-window-seconds: ${EDUCARE_TRIGGER_WINDOW:30}
  schedule:
    # E-1：定时扫描总开关。默认关闭，避免开发环境误触发整校扫描；生产经 Nacos 改为 true
    enabled: ${EDUCARE_SCHEDULE_ENABLED:false}
    # 每日 02:00 触发；Spring cron 6 字段（秒 分 时 日 月 周）
    cron: ${EDUCARE_SCHEDULE_CRON:0 0 2 * * ?}
  debug:
    # 仅用于端到端冒烟测试：强制风险等级跳过 LLM 直接进入完整 4 阶段流水线。
    # 生产环境请保持为空。可设 high/medium/low/none。
    force-risk-level: ${EDUCARE_DEBUG_FORCE_RISK_LEVEL:}
  # G-1.3：风险识别 system prompt 已迁移到 classpath:/prompts/risk-analyze.system.md
  # 修改 prompt 直接编辑该文件，无需碰 YAML / Nacos。
  llm:
    # G-1.4：透传给 llama.cpp 的扩展开关。新版本 llama.cpp 默认 true，显式声明兼容旧版。
    cache-prompt: ${EDUCARE_LLM_CACHE_PROMPT:true}
  # AgentLoop 主路径开关（单布尔）。
  # enabled=true（默认）→ AgentTaskServiceImpl.doExecute 走 AgentLoop（一次性 think→tool→observe 完成
  #   "风险识别 + 计划生成"，RAG 检索由 knowledge-rag MCP tool 自然完成；合规审核 P4 仍走原 audit 端点）。
  # enabled=false → 回落旧 4 阶段流水线（risk → rag → plan → audit）作 fallback。
  agent:
    loop:
      enabled: ${EDUCARE_AGENT_LOOP_ENABLED:true}
      # J-3.4：工具协议。react（默认，thought/observation 细粒度可观测）或 native（Spring AI 原生
      # tool-calling 隐式内部循环，省协议开销，适合云端/大模型；失去 thought/observation 细粒度）。
      protocol: ${EDUCARE_AGENT_LOOP_PROTOCOL:react}
    # H-3.5：Skill 加载器。enabled=true 时把 active 列出的 classpath skills/*.md 注入 AgentLoop system prompt。
    skills:
      enabled: ${EDUCARE_AGENT_SKILLS_ENABLED:true}
      active: ${EDUCARE_AGENT_SKILLS_ACTIVE:risk-assessment,psychological-screening,intervention-design,compliance-audit}
    # J-1.2：工具守卫。enabled=false 全放行；allowed-tools 非空则只放行名单内工具；
    # sensitive-tools 需 sensitiveDataAllowed 或管理员/心理咨询师角色（async 系统任务无上下文时默认放行）。
    tool-guard:
      enabled: ${EDUCARE_AGENT_TOOL_GUARD_ENABLED:true}
      allowed-tools: ${EDUCARE_AGENT_TOOL_GUARD_ALLOWED:}
      sensitive-tools: ${EDUCARE_AGENT_TOOL_GUARD_SENSITIVE:get_mental_indicators}
    # J-2.1：子代理（班主任/心理咨询师/学业导师 agent-as-tool）。默认关，不扰动既有默认链路。
    subagents:
      enabled: ${EDUCARE_AGENT_SUBAGENTS_ENABLED:false}
      max-iterations: ${EDUCARE_AGENT_SUBAGENTS_MAX_ITER:4}
    # J-3.2：AgentLoop 过程流式（每轮 thought/tool 发 Redis PROGRESS_CHANNEL，前端 SSE 展示）。默认关。
    streaming:
      enabled: ${EDUCARE_AGENT_STREAMING_ENABLED:false}
    # J-3.3：检查点（每轮轨迹 RPUSH Redis，崩溃可 post-mortem/续跑基础）。默认关。
    checkpoint:
      enabled: ${EDUCARE_AGENT_CHECKPOINT_ENABLED:false}
      ttl-seconds: ${EDUCARE_AGENT_CHECKPOINT_TTL:3600}

# G-5.3：Langfuse trace。所有字段空时 LangfuseClient 自动 no-op，主流程零影响。
# self-hosted v2：host 用 docker 内网名 langfuse-server:3000；本地裸跑用 http://localhost:3001
langfuse:
  public-key: ${LANGFUSE_PUBLIC_KEY:}
  secret-key: ${LANGFUSE_SECRET_KEY:}
  host: ${LANGFUSE_HOST:}
