server:
  port: ${PORT:8080}

# P0 鉴权门：默认开（校验 JWT 签名 + 未过期，拦截未登录直达业务服务）。
# 本地免登录联调 / 灰度排障可改 false（@Value 非 @RefreshScope，改后重启网关生效）。
educare:
  gateway:
    auth:
      enabled: true

spring:
  application:
    name: gateway-service

  main:
    web-application-type: reactive

  profiles:
    active: dev

  # A6 登出撤销：网关读会话白名单（token:{userId}）所在 Redis，与 auth-service 登录写入同实例。
  # 注：Boot 3.2 正确命名空间为 spring.data.redis.*；默认 localhost:6379 与 auth-service 一致。
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0


  cloud:
    nacos:
      # 注册中心
      discovery:
        enabled: ${SPRING_CLOUD_NACOS_DISCOVERY_ENABLED:true}
        register-enabled: ${SPRING_CLOUD_NACOS_DISCOVERY_REGISTER_ENABLED:true}
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        identity-key: ${NACOS_AUTH_IDENTITY_KEY:serverIdentity}
        identity-value: ${NACOS_AUTH_IDENTITY_VALUE:security}
        service: ${spring.application.name}

      # 配置中心
      config:
        enabled: ${SPRING_CLOUD_NACOS_CONFIG_ENABLED:true}
        import-check:
          enabled: false
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        identity-key: ${NACOS_AUTH_IDENTITY_KEY:serverIdentity}
        identity-value: ${NACOS_AUTH_IDENTITY_VALUE:security}
        file-extension: yml

    # Gateway 路由配置
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        # 引擎服务
        - id: agent-service
          uri: ${AGENT_SERVICE_URL:lb://agent-service}
          predicates:
            - Path=/agent/**
          filters:
            - StripPrefix=0

        # 认证服务
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:lb://auth-service}
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=0

        # 用户服务
        - id: user-service
          uri: ${USER_SERVICE_URL:lb://user-service}
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=0

        # 教师服务
        - id: teacher-service
          uri: ${TEACHER_SERVICE_URL:lb://teacher-service}
          predicates:
            - Path=/teacher/**
          filters:
            - StripPrefix=0

        # 学生服务
        - id: student-service
          uri: ${STUDENT_SERVICE_URL:lb://student-service}
          predicates:
            - Path=/student/**
          filters:
            - StripPrefix=0

        # 心理健康服务
        - id: mental-service
          uri: ${MENTAL_SERVICE_URL:lb://mental-service}
          predicates:
            - Path=/mental/**
          filters:
            - StripPrefix=0

        # 数据分析服务
        - id: data-service
          uri: ${DATA_SERVICE_URL:lb://data-service}
          predicates:
            - Path=/data/**
          filters:
            - StripPrefix=0

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: false

# Actuator + Prometheus：公网入口指标（http.server.requests 速率/错误/时延）。
# 只放 health/info/prometheus；filter 已放行 /actuator/（PUBLIC_PREFIXES），且不在 /api 下故不经 nginx 对外。
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.springframework.cloud.gateway: debug